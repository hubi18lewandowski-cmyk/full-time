    const acc = hist.length ? Math.round(hist.filter(h => h.pts > 0).length / hist.length * 100) : 0;
    let streak = 0; for(const h of hist){ if(h.pts > 0) streak++; else break; }
    const now = Date.now(), horizon = now + 8 * 864e5;
    const open = allEvents().filter(({e, ctx}) => e.home && state(e, ctx) === 'up' && toDate(e) <= horizon).sort((a,b) => toDate(a.e) - toDate(b.e));

  const surname = n => n.split(' ').slice(-1)[0];
  function caCompute(){
    const ds = caDrivers(), rs = caRaces();
    const tot = ds.map(d => ({d, p:d.p, w:0}));
    let decided = null;
    rs.forEach((r, ri) => {
      ds.forEach((d, di) => { const pos = (caSel[r.id] || {})[d.n]; if(pos){ tot[di].p += PTS[pos - 1]; if(pos === 1) tot[di].w++; } });
      if(!decided){

  }

  function caPaint(){

  ['it','pt','zh'].forEach(k => { if(!sel.querySelector(`option[value="${k}"]`)){ const o = document.createElement('option'); o.value = k; o.textContent = LANGS.find(x => x[0] === k)[1]; sel.appendChild(o); } });
  { const st = load('ft-lang', null); if(st && T[st] && st !== lang){ lang = st; setFormatters(); renderRings(); } }
  const S = {theme:load('ft-theme', 'dark'), pal:load('ft-pal', 'full'), one:load('ft-one', '#7cf29a')};
  const AMB0 = JSON.parse(JSON.stringify(AMB));
  const inkFor = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255; return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#0b0d12' : '#ffffff'; };
  function applySettings(first){
    const h = document.documentElement;
    h.dataset.theme = S.theme; h.dataset.palette = S.pal;
    const light = S.theme === 'light';
    const p1 = S.pal === 'one' ? S.one : (light ? '#14a44d' : '#7cf29a');
    h.style.setProperty('--one', p1); h.style.setProperty('--one-ink', inkFor(p1));
    h.style.setProperty('--snow', light ? '#8cc3e6' : '#ffffff');
    for(const [k, v] of Object.entries(AMB0)) AMB[k].colors = S.pal === 'full' ? v.colors.slice() : S.pal === 'one' ? [p1, light ? '#9aa3b5' : '#ffffff'] : [p1, light ? '#c98a00' : '#ffcc33'];
    const mc = document.querySelector('meta[name="theme-color"]'); if(mc) mc.content = light ? '#f4f6fa' : '#07090f';
    if(!first){ if(!curView) mountAmbient(); if(typeof winterStop !== 'undefined' && winterStop){ winterStop(); winterStop = null; winterSync(); } }
  }
  applySettings(true);
  // gear button + panel
  const gear = document.createElement('button'); gear.className = 'gear'; gear.type = 'button'; gear.id = 'gear'; gear.setAttribute('aria-haspopup', 'dialog');
  gear.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  $('#burger').before(gear);
  document.querySelector('.lang').classList.add('lang-moved');
  const setEl = document.createElement('div'); setEl.className = 'drawer set-dr'; setEl.id = 'settings'; setEl.hidden = true; document.body.appendChild(setEl);
  function renderSettings(){
    gear.setAttribute('aria-label', t('set'));
    setEl.innerHTML = `<div class="dr-panel set-panel" role="dialog" aria-modal="true" aria-labelledby="set-h"><div class="dr-top"><h2 id="set-h">⚙️ ${esc(t('set'))}</h2><button class="pk-x" type="button" data-setclose aria-label="${esc(t('close'))}">×</button></div>
      <div class="set-body">
        <section><h3>${esc(t('setLang'))}</h3><div class="set-langs">${LANGS.map(([k, n]) => `<button type="button" data-setlang="${k}" aria-pressed="${k === lang}"><b>${esc(n)}</b>${k === 'en' ? '<small>★</small>' : ''}</button>`).join('')}</div>${['it','pt','zh'].includes(lang) ? `<p class="note" style="margin-top:8px">${esc(t('langNote'))}</p>` : ''}</section>
        <section><h3>${esc(t('setTheme'))}</h3><div class="set-seg">${['dark','light'].map(k => `<button type="button" data-settheme="${k}" aria-pressed="${S.theme === k}"><span class="sw ${k}"></span>${esc(t(k))}</button>`).join('')}</div></section>
        <section><h3>${esc(t('setCol'))}</h3><div class="set-cols">${[['full','colFull','colFullS'],['three','col3','col3S'],['one','col1','col1S']].map(([k, a, b]) => `<button type="button" data-setpal="${k}" aria-pressed="${S.pal === k}"><span class="dots ${k}"><i></i><i></i><i></i><i></i><i></i></span><span><b>${esc(t(a))}</b><small>${esc(t(b))}</small></span></button>`).join('')}</div>
          ${S.pal === 'one' ? `<div class="set-sw"><span>${esc(t('pick'))}</span><div>${SWATCH.map(c => `<button type="button" data-setone="${c}" style="--s:${c}" aria-pressed="${S.one === c}" aria-label="${c}"></button>`).join('')}</div></div>` : ''}</section>
      </div></div>`;
  }
  let setLast = null;
  function openSettings(){ setLast = document.activeElement; renderSettings(); setEl.hidden = false; setTimeout(() => { const f = setEl.querySelector('[aria-pressed="true"]'); if(f) f.focus(); }, 60); }
  function closeSettings(){ setEl.hidden = true; if(setLast && setLast.focus) setLast.focus(); }
  gear.addEventListener('click', openSettings);
  setEl.addEventListener('click', e => {
    if(e.target === setEl || e.target.closest('[data-setclose]')){ closeSettings(); return; }
    const l = e.target.closest('[data-setlang]'); if(l){ sel.value = l.dataset.setlang; sel.dispatchEvent(new Event('change')); renderSettings(); return; }
    const th = e.target.closest('[data-settheme]'); if(th){ S.theme = th.dataset.settheme; save('ft-theme', S.theme); applySettings(); renderSettings(); return; }
    const p = e.target.closest('[data-setpal]'); if(p){ S.pal = p.dataset.setpal; save('ft-pal', S.pal); applySettings(); renderSettings(); return; }
    const o = e.target.closest('[data-setone]'); if(o){ S.one = o.dataset.setone; save('ft-one', S.one); applySettings(); renderSettings(); }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !setEl.hidden){ e.stopPropagation(); closeSettings(); } }, true);
  $('#lang').addEventListener('change', () => { gear.setAttribute('aria-label', t('set')); });

  applyStatic(); tickMidnight(); renderMine(); render(cur, false);
  setInterval(() => { tickMidnight(); tickCountdowns(); }, 1000);
})();
</script>

</body></html>
